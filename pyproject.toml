[project]
name = "factoid"
version = "0.1.23"
description = "Turn documents into facts and entities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Endgame Labs, Inc." }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.5.4",
    "pydantic>=2.9",
]

[project.optional-dependencies]
parquet = ["pyarrow>=18"]

[project.urls]
Homepage = "https://github.com/Endgame-Labs/factoid"
Source = "https://github.com/Endgame-Labs/factoid"
Issues = "https://github.com/Endgame-Labs/factoid/issues"

[project.scripts]
factoid = "factoid.cli:main"

[dependency-groups]
dev = [
    "pyarrow>=18",
    "pytest>=8",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["examples/*/data", "examples/*/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF012: classes declare settings as plain class attributes (`traits = [...]`, `columns = {...}`); that is the API.
ignore = ["RUF012", "B905"]  # B905: zip over lists built together, where a length check adds nothing

[tool.ruff.lint.per-file-ignores]
# Example suites hold long expected answers and real quotes (en dashes included) as data.
"examples/**" = ["E501", "RUF001", "SIM115"]

[tool.hatch.build.targets.sdist]
# The source release is the library and its tests. Example apps keep large local data (data/, runs/, .factoid/).
include = ["/src/factoid", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
