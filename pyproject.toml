[project]
name = "factoid"
version = "0.1.1"
description = "Turn documents into facts and entities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.5.4",
    "pydantic>=2.9",
]

[project.scripts]
factoid = "factoid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
