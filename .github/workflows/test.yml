name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests examples site
      - run: uv run --frozen --project site python site/app.py build
